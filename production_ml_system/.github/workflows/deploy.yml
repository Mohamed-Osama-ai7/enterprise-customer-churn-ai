name: ML Pipeline CI/CD Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Training Pipeline and Artifact Generation
      run: |
        python train.py

    - name: Verify Artifact Integrity
      run: |
        test -f models/champion_pipeline.joblib
        test -f models/stacking_pipeline.joblib
        test -f plots/models_benchmark.csv

    - name: Test Docker Container Build
      run: |
        docker build -t churn-ai-app:latest .
